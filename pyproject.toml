[project]
name = "computeruse"
version = "0.1.0"
description = "Autonomous screenshot-in, actions-out desktop agent"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0.1",
    "pyautogui>=0.9.54",
    "pynput>=1.7.7",
    "pywinauto>=0.6.8",
    "pillow>=10.0.0",
    "langgraph>=0.2.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# chat-template formatting only (training/chat_format.py) -- verifying
# prompt structure against the real tokenizer, not running the model. The
# actual LoRA training run needs torch/peft/a GPU and happens on Kaggle/
# Colab (ADR-0003's $0-budget commitment), not from this list.
training = [
    "transformers>=4.45.0",
    "jinja2>=3.1.0",
]

[project.scripts]
computeruse = "computeruse.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
