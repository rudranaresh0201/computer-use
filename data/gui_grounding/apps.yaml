# App registry for dataset collection (Phase 3, ADR-0003).
#
# Schema consumed by src/computeruse/dataset/registry.py. App list, pools,
# and richness labels match the table in
# docs/research/gui-grounding-dataset-design.md.
#
# Drive step kinds (see registry.DriveStep):
#   key           -- text: a pyautogui-style key combo, e.g. "ctrl+f"
#   type          -- text: literal text to type
#   click_element -- name/control_type: found via UIA in the current window,
#                    center is clicked (no hardcoded pixel coordinates)
#   wait          -- duration_seconds: pause
#
# VLC / GIMP / Audacity / Notepad++ need a one-time install (per the design
# doc) and their `launch.target` paths below are the common default install
# locations — if not installed on a given machine, the orchestrator logs the
# launch failure for that app and moves on to the next one.
#
# ---------------------------------------------------------------------------
# EXPANDED 2026-07-19. Two changes, both driven by the dataset audit
# (docs/journal.md):
#
# 1. MORE STATES. The previous list averaged 2-3 states per app, which
#    yielded 32 unique screenshots behind 542 rows. Screenshots — not rows —
#    are the scarce resource: 252 training rows over 14 images is 18
#    instructions against the same picture. Every app below now defines
#    6-10 states.
#
# 2. GEOMETRY VARIANTS. Each state is captured at several window sizes
#    (`geometry_variants`, declared once per app and inherited by its
#    states). The ground-truth box moves with the window, so this directly
#    penalizes memorizing absolute pixel positions — the failure mode the
#    old single-geometry dataset actively encouraged. All variants of a
#    state share that state's split, because two sizes of one screen are
#    near-duplicates and splitting them across train/dev would be leakage.
#
# STATE AUTHORING RULE: states run sequentially against whatever the
# previous state left on screen — the orchestrator does not reset the app
# between them. So every state that could inherit an open dialog starts
# with an `escape`. Do not remove those; without them a state silently
# collects the *previous* state's dialog and mislabels it.
# ---------------------------------------------------------------------------

# Reused by every app below via YAML anchors. Three sizes: a compact window,
# a mid-size one, and a large one. `left`/`top` differ too, so position is
# not correlated with size.
_geometry: &standard_geometry
  - {name: compact, width: 900, height: 620, left: 80, top: 60}
  - {name: medium, width: 1280, height: 800, left: 300, top: 120}
  - {name: large, width: 1600, height: 950, left: 40, top: 30}

# Apps that refuse to resize below a large minimum, or whose layout is
# meaningless when small, get only two larger variants.
_geometry_large: &large_geometry
  - {name: medium, width: 1280, height: 850, left: 220, top: 90}
  - {name: large, width: 1650, height: 980, left: 40, top: 30}

apps:
  - name: notepad
    pool: train
    richness: rich
    # Windows 11 Notepad is single-instance with tab persistence: launching
    # notepad.exe while one is already running attaches to that window and
    # its real tabs instead of opening a fresh blank document. Confirmed
    # twice as a real leak (docs/journal.md, 2026-07-13 and 2026-07-16) --
    # single_instance=true makes the orchestrator refuse to launch into an
    # already-running instance rather than silently reusing it.
    single_instance: true
    launch: {method: exe, target: notepad.exe}
    window_title_contains: "Notepad"
    geometry_variants: *standard_geometry
    states:
      - name: empty_document
        split: train
        steps: []
      - name: with_text
        split: train
        steps:
          - {kind: type, text: "The quick brown fox jumps over the lazy dog."}
      - name: multiline_text
        split: train
        steps:
          - {kind: type, text: "alpha\nbeta\ngamma\ndelta"}
      - name: file_menu_open
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+f"}
      - name: edit_menu_open
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+e"}
      - name: find_dialog
        split: dev
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+f"}
      - name: replace_dialog
        split: dev
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+h"}
      - name: save_as_dialog
        split: test_same_app
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+shift+s"}

  - name: calculator
    pool: train
    richness: rich
    launch: {method: exe, target: calc.exe}
    window_title_contains: "Calculator"
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: train
        steps: []
      - name: after_input
        split: train
        steps:
          - {kind: type, text: "12345"}
      - name: after_arithmetic
        split: train
        steps:
          - {kind: key, text: "escape"}
          - {kind: type, text: "84*7="}
      - name: scientific_mode
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "alt+2"}
      - name: programmer_mode
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "alt+3"}
      - name: date_calculation_mode
        split: dev
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "alt+4"}
      - name: navigation_open
        split: dev
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "alt+1"}
          - {kind: click_element, name: "Open Navigation", control_type: Button}
      - name: history_pane
        split: test_same_app
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+2"}
          - {kind: key, text: "ctrl+h"}

  - name: file_explorer
    pool: train
    richness: rich
    # RE-COLLECTED 2026-07-19. Every previous file_explorer screenshot was
    # actually the code editor: focus was stolen mid-run and the collector
    # had no verification step, so all 4 states (157 rows, 29% of the whole
    # dataset) were labeled from the wrong window. The collector now
    # verifies the foreground window before labeling and raises on a
    # mismatch -- see collector.WindowMismatchError.
    launch: {method: exe, target: explorer.exe}
    window_title_contains: "File Explorer"
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: train
        steps: []
      - name: address_bar_focused
        split: train
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+l"}
      - name: this_pc
        split: train
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+l"}
          - {kind: type, text: "shell:MyComputerFolder\n"}
      - name: details_view
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+shift+6"}
      - name: large_icons_view
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+shift+2"}
      - name: search_box_focused
        split: dev
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+e"}
      - name: new_folder_prompt
        split: dev
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+shift+n"}
          - {kind: key, text: "escape"}
      - name: details_pane
        split: test_same_app
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+shift+p"}

  - name: settings
    pool: train
    richness: rich
    # Deliberately not "ms-settings:" (bare Home page): Home renders the
    # signed-in account name and the currently connected Wi-Fi network name
    # directly on screen -- both real PII, captured into a screenshot once
    # already (docs/journal.md, 2026-07-16 incident). personalization is a
    # neutral rich page (Background/Colors/Themes/Fonts) with no account or
    # network info rendered anywhere in frame.
    #
    # Every state below is likewise a neutral page. Do NOT add Accounts,
    # Network & internet, or Home.
    launch: {method: shell, target: "ms-settings:personalization"}
    window_title_contains: "Settings"
    geometry_variants: *large_geometry
    states:
      - name: personalization
        split: train
        steps: []
      - name: accessibility
        split: train
        settle_seconds: 1.0
        steps:
          - {kind: click_element, name: "Accessibility", control_type: ListItem}
      - name: apps
        split: train
        settle_seconds: 1.0
        steps:
          - {kind: click_element, name: "Apps", control_type: ListItem}
      - name: gaming
        split: train
        settle_seconds: 1.0
        steps:
          - {kind: click_element, name: "Gaming", control_type: ListItem}
      - name: time_and_language
        split: dev
        settle_seconds: 1.0
        steps:
          - {kind: click_element, name: "Time & language", control_type: ListItem}
      - name: search_focused
        split: dev
        steps:
          # name is empty string for this control (only automation_id is
          # stable) -- same placeholder-name pattern as Control Panel's
          # search box; found via live inspection, 2026-07-13.
          - {kind: click_element, automation_id: CommandSearchTextBox}

  - name: task_manager
    pool: train
    richness: rich
    # REQUIRES AN ELEVATED COLLECTION SESSION (2026-07-15). Not a COM/broker
    # activation failure as first theorised, and not DWM cloaking: taskmgr
    # carries autoElevate=true and runs at High integrity with no UAC
    # prompt, while the collector runs at Medium. Windows enforces UIPI as a
    # hard boundary, so the window is genuinely unreachable from a
    # non-elevated session. Launch a terminal via Start -> right-click ->
    # "Terminal (Admin)", verify IsInRole(Administrator) is True, then run.
    launch: {method: exe, target: taskmgr.exe}
    window_title_contains: "Task Manager"
    geometry_variants: *large_geometry
    states:
      - name: processes_tab
        split: train
        steps: []
      - name: performance_tab
        split: train
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "ctrl+2"}
      - name: app_history_tab
        split: train
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "ctrl+3"}
      - name: startup_apps_tab
        split: train
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "ctrl+4"}
      - name: details_tab
        split: dev
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "ctrl+5"}
      - name: services_tab
        split: dev
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "ctrl+6"}

  - name: control_panel
    pool: train
    richness: rich
    launch: {method: exe, target: control.exe}
    window_title_contains: "Control Panel"
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: train
        steps: []
      - name: large_icons_view
        split: train
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "escape"}
          - {kind: click_element, name: "System and Security", control_type: Hyperlink}
          - {kind: key, text: "alt+left"}
      - name: ease_of_access
        split: train
        settle_seconds: 0.8
        steps:
          - {kind: click_element, name: "Ease of Access", control_type: Hyperlink}
      - name: appearance
        split: dev
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "alt+left"}
          - {kind: click_element, name: "Appearance and Personalization", control_type: Hyperlink}
      - name: search_focused
        split: dev
        steps:
          # name is a placeholder "\r" for this control, not real text --
          # matched by automation_id instead (found via live inspection,
          # 2026-07-13; see docs/journal.md)
          - {kind: click_element, automation_id: SearchEditBox}

  - name: paint
    pool: train
    richness: weak
    launch: {method: exe, target: mspaint.exe}
    window_title_contains: "Paint"
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: train
        steps: []
      - name: brush_tool
        split: train
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "b"}
      - name: text_tool
        split: train
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "t"}
      - name: fill_tool
        split: train
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "f"}
      - name: shapes_available
        split: dev
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+w"}
          - {kind: key, text: "escape"}
      - name: resize_dialog
        split: test_same_app
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+w"}

  - name: windows_terminal
    pool: train
    richness: weak
    # FIXED (2026-07-14): wt.exe's visible window is titled after the shell
    # running in the default tab ("Windows PowerShell" on this machine),
    # never "Terminal" -- window_title_contains alone never matched. Its
    # window_class (CASCADIA_HOSTING_WINDOW_CLASS) is reliable regardless of
    # which shell tab is active, so the orchestrator now also matches on
    # class (see registry.py's window_class_contains, orchestrator.py's
    # _window_matches). Unlike task_manager, this was a matching bug, not a
    # real activation failure.
    launch: {method: exe, target: wt.exe}
    window_title_contains: "Terminal"
    window_class_contains: "CASCADIA_HOSTING_WINDOW_CLASS"
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: train
        steps: []
      - name: two_tabs
        split: train
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "ctrl+shift+t"}
      - name: three_tabs
        split: train
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "ctrl+shift+t"}
      - name: split_pane
        split: train
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "alt+shift+plus"}
      - name: command_palette
        split: dev
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "ctrl+shift+p"}
      - name: dropdown_menu
        split: dev
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+comma"}

  - name: vlc
    pool: train
    richness: weak
    launch: {method: exe, target: "C:\\Program Files\\VideoLAN\\VLC\\vlc.exe"}
    window_title_contains: "VLC"
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: train
        steps: []
      - name: media_menu_open
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+m"}
      - name: playback_menu_open
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+l"}
      - name: tools_menu_open
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+t"}
      - name: open_dialog
        split: dev
        settle_seconds: 0.8
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+o"}
      - name: preferences_dialog
        split: dev
        settle_seconds: 1.0
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+p"}

  - name: gimp
    pool: train
    richness: weak
    # installed 2026-07-13 via winget as GIMP 3.2.4, per-user install (no
    # admin needed) -- actual path differs from the GIMP 2.10 path assumed
    # when this registry was first drafted.
    launch: {method: exe, target: "C:\\Users\\Rudra\\AppData\\Local\\Programs\\GIMP 3\\bin\\gimp-3.exe"}
    # real window title is "GNU Image Manipulation Program", not "GIMP" --
    # "GIMP" only ever matches its ~20s "GIMP Startup" splash window, which
    # is a different top-level window entirely (found via live inspection,
    # 2026-07-13). launch_timeout_seconds raised past the splash duration.
    window_title_contains: "Manipulation Program"
    launch_timeout_seconds: 30.0
    # KNOWN LIMITATION (2026-07-13): the process exits cleanly (exit code 0)
    # 5-15s after launch in this environment -- likely a GTK
    # rendering/display-access issue specific to this automation session.
    # The collector is normally fast enough to capture before it dies
    # (2026-07-15), but that is a race, not a fix: keep the state list short
    # and expect variants to fail. Geometry variants are deliberately NOT
    # set here -- each resize costs time this app does not have.
    states:
      - name: default
        split: train
        steps: []
      - name: file_menu_open
        split: train
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+f"}

  - name: device_manager
    pool: held_out
    richness: rich
    # REQUIRES AN ELEVATED COLLECTION SESSION. devmgmt.msc needs an admin
    # token; from a standard user the launch fails outright with WinError
    # 740. Same bucket as task_manager -- not something a script should
    # bypass, since that would mean silently working around UAC.
    launch: {method: exe, target: mmc.exe, args: ["devmgmt.msc"]}
    window_title_contains: "Device Manager"
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: test_held_out_app
        steps: []
      - name: category_expanded
        split: test_held_out_app
        steps:
          - {kind: key, text: "right"}
      - name: second_category
        split: test_held_out_app
        steps:
          - {kind: key, text: "down"}
          - {kind: key, text: "right"}
      - name: view_menu_open
        split: test_held_out_app
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+v"}

  - name: character_map
    pool: held_out
    richness: rich
    launch: {method: exe, target: charmap.exe}
    window_title_contains: "Character Map"
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: test_held_out_app
        steps: []
      - name: advanced_view
        split: test_held_out_app
        settle_seconds: 0.6
        steps:
          - {kind: click_element, name: "Advanced view", control_type: CheckBox}
      - name: character_selected
        split: test_held_out_app
        steps:
          - {kind: key, text: "right"}
          - {kind: key, text: "right"}

  - name: audacity
    pool: held_out
    richness: weak
    # RE-COLLECTED 2026-07-19: the previous audacity_0000 was not Audacity at
    # all -- it was the code editor, captured because focus was stolen and
    # nothing verified the window. It was the ONLY audacity screenshot, so
    # 100% of this held-out app was wrong, and H3's generalization claim was
    # resting on it. Installed via winget; a cold first run needs a longer
    # timeout (2026-07-15).
    launch: {method: exe, target: "C:\\Program Files\\Audacity\\Audacity.exe"}
    window_title_contains: "Audacity"
    launch_timeout_seconds: 30.0
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: test_held_out_app
        steps: []
      - name: file_menu_open
        split: test_held_out_app
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+f"}
      - name: edit_menu_open
        split: test_held_out_app
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+e"}
      - name: tracks_menu_open
        split: test_held_out_app
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+t"}

  - name: notepad_plus_plus
    pool: held_out
    richness: weak
    launch: {method: exe, target: "C:\\Program Files\\Notepad++\\notepad++.exe"}
    window_title_contains: "Notepad++"
    geometry_variants: *standard_geometry
    states:
      - name: default
        split: test_held_out_app
        steps: []
      - name: with_text
        split: test_held_out_app
        steps:
          - {kind: type, text: "held-out app smoke text"}
      - name: find_dialog
        split: test_held_out_app
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "ctrl+f"}
      - name: view_menu_open
        split: test_held_out_app
        settle_seconds: 0.6
        steps:
          - {kind: key, text: "escape"}
          - {kind: key, text: "alt+v"}
